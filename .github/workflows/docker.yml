# Builds the server + web images and publishes them to this repo's GitHub Container Registry.
#   main push / dispatch: ghcr.io/<owner>/kinora-{server,web}:{latest,sha-<7>} (multi-arch)
#   app-v* tag push:      ...:{X.Y.Z, X.Y, latest, sha-<7>} - the release charts/kinora pins as
#                         its appVersion. `app-v*` and not `v*`: that namespace already belongs
#                         to desktop-release.yml, which versions from packages/desktop.
#   pull_request:         build only (both arches), nothing pushed
# Each arch builds on its own native runner (no QEMU); `merge` stitches the per-arch digests into
# one manifest list per image. This is what selfhost/docker-compose.yml pulls.
name: Docker

on:
  push:
    branches: [main]
    # Release tags. NOTE: one `push` block cannot carry per-ref path filters, so paths-ignore
    # below also applies to tag pushes - if a release tag ever lands on a docs-only commit it
    # gets filtered out. Re-run via workflow_dispatch against the tag ref if that happens.
    tags: ['app-v*']
    paths-ignore:
      - website/**
      - docs/**
      - charts/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - website/**
      - docs/**
      - charts/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.image }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
        platform: [linux/amd64, linux/arm64]
        # include only maps each platform axis value to its native runner.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # GHCR requires a lowercase image name; repository_owner keeps the owner's casing.
      - name: Resolve image name
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kinora-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here (org.opencontainers.image.source links the package to this repo);
      # tags are applied by `merge` on the manifest list.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      # Context is the repo root (pnpm workspace). The web image gets no VITE_KINORA_SERVER_URL so
      # it resolves the server at runtime from the page origin (single-origin self-host nginx).
      - name: Build${{ github.event_name != 'pull_request' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge (${{ matrix.image }})
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        image: [server, web]
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kinora-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z / X.Y come from the app-v* tag and no-op on a main push; sha-<7> pins an exact
      # commit (KINORA_IMAGE_TAG in selfhost/.env, image.tag in charts/kinora/values.yaml).
      # latest tracks main (is_default_branch, which is false on a tag ref) and the newest
      # app-v* release (latest=auto, below).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # The default, spelled out: this is what puts `latest` on an app-v* release, and it
          # deliberately skips prereleases - app-v1.0.0-rc.1 publishes 1.0.0-rc.1 and nothing else.
          flavor: latest=auto
          # `match` extracts the bare version from the tag: metadata-action parses the whole ref
          # name, and `app-v0.2.0` is not valid semver, so without it both rules warn and no-op
          # and a release publishes nothing but sha-<7> - leaving the chart's appVersion image
          # tag missing and every default `helm install` in ImagePullBackOff.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},match=^app-v(.*)$
            type=semver,pattern={{major}}.{{minor}},match=^app-v(.*)$
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is the point: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
