# Every credential lives outside Helm. All the inline values stay empty, which proves the
# guards honour the existingSecret and mappings escape hatches instead of failing closed.
publicUrl: https://kinora.example.com
secrets:
  existingSecret: kinora-credentials
  mappings:
    POSTGRES_PASSWORD:
      name: kinora-pg-app
      key: password
postgres:
  enabled: false
  host: kinora-pg-rw
  username: kinora
  database: kinora
auth:
  oidc:
    issuerUrl: https://id.example.com/realms/main
    clientId: kinora
