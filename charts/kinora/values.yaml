# kinora - a dashboard for your Playwright reports, across projects and over time.
#
# Minimum viable install - everything else has a working default:
#
#   helm install kinora oci://ghcr.io/amaingot/charts/kinora \
#     --set publicUrl=https://kinora.example.com \
#     --set auth.secret="$(openssl rand -hex 32)" \
#     --set postgres.password="$(openssl rand -hex 16)" \
#     --set ingress.enabled=true
#
# Sections run: what you must set, then the app's own configuration (one section per feature),
# then per-workload Kubernetes knobs.

# =============================================================================================
# Required
# =============================================================================================

# -- The URL your users reach kinora at, scheme included, no trailing slash and no path.
# The single most important value. It becomes BOTH `BASE_URL` and `WEB_ORIGIN` on the server,
# because the web pod reverse-proxies /api, /trpc and /artifacts on its own origin - there is
# one origin, so there is no CORS and the session cookie stays host-only.
# It drives OAuth/OIDC callback URLs, e-mail links, and the absolute artifact URLs the trace
# viewer's service worker fetches **from the browser**. A cluster-internal URL renders the
# dashboard fine and then fails to load a single trace.
publicUrl: ''

# =============================================================================================
# Secrets
#
# Four tiers, in increasing precedence. They fall out of Kubernetes semantics - EVERY `env`
# entry beats EVERY `envFrom` source whatever the order, and a later `envFrom` beats an earlier
# one - so the chart itself arbitrates nothing:
#
#   1. inline values below (auth.secret, postgres.password, ...) -> a chart-managed Secret
#   2. secrets.existingSecret  -> one Secret, keys named after the env vars, mounted envFrom
#   3. secrets.mappings        -> per-variable secretKeyRef, an `env` entry, so it beats 1 and 2
#   4. server.extraEnv         -> raw core/v1 EnvVar, appended last, the last word
#
# server.extraEnvFrom is deliberately NOT on that ladder. It is an `envFrom` source, rendered
# after the chart's Secret and after secrets.existingSecret, so it overrides tiers 1 and 2 - and
# nothing else. Tiers 3 and 4, and every variable the chart renders as a plain `env` entry
# (BASE_URL, POSTGRES_HOST, ...), outrank it. Reach for server.extraEnv when you need to win.
#
# The chart NEVER generates a credential. A generated default is re-rendered on every
# `helm upgrade`, which would roll AUTH_SECRET (signing out every user) and POSTGRES_PASSWORD
# (which initdb already burned into the database). See the README.
# =============================================================================================

secrets:
  # -- Name of a Secret you created yourself whose **keys are the literal environment variable
  # names**: AUTH_SECRET, POSTGRES_PASSWORD, OIDC_CLIENT_SECRET, GOOGLE_CLIENT_SECRET,
  # GITHUB_CLIENT_SECRET, SLACK_CLIENT_SECRET, SMTP_PASS, S3_ACCESS_KEY_ID,
  # S3_SECRET_ACCESS_KEY. Mounted with `envFrom`, so any key present here overrides the
  # matching inline value. One Secret covers every credential. Being an `envFrom` source it
  # cannot override a variable the chart renders as a plain `env` entry, nor `secrets.mappings`.
  existingSecret: ''
  # -- For Secrets whose key names you do not control - CloudNativePG's `password`, External
  # Secrets, Sealed Secrets. Maps an environment variable to a specific Secret key, rendered as
  # `env[].valueFrom.secretKeyRef`, which outranks the inline values, `existingSecret` and
  # `server.extraEnvFrom` - an `env` entry beats every `envFrom` source.
  # @default -- `{}`
  mappings: {}
  #  POSTGRES_PASSWORD:
  #    name: kinora-pg-app
  #    key: password

# =============================================================================================
# Authentication
# =============================================================================================

auth:
  # -- Session secret **and** the HMAC key that signs local-filesystem artifact URLs.
  # Generate with `openssl rand -hex 32`. Required unless supplied via `secrets.*`.
  # Rotating it signs everyone out and invalidates outstanding artifact links (1h TTL, so
  # that half is harmless).
  secret: ''
  # -- SSO-only install: turn e-mail + password sign-in and sign-up off entirely.
  # The server refuses to boot if this is true with no provider configured, so a typo cannot
  # lock everyone out; the chart pre-checks the same rule at render time.
  disablePasswordAuth: false
  # -- Share the session cookie across subdomains, e.g. `.example.com`. Leave EMPTY for the
  # normal single-origin install - the cookie is then host-only, which is what you want.
  cookieDomain: ''

  oidc:
    # -- Generic OpenID Connect SSO: Okta, Keycloak, Entra ID, Authentik, Auth0, Google
    # Workspace. Active once issuerUrl + clientId + clientSecret are all set.
    # Register this redirect URI with your IdP: `<publicUrl>/api/auth/oauth2/callback/oidc`
    # (the `oidc` segment is fixed and not configurable). Users are provisioned just-in-time,
    # and an e-mail that already has an account is linked rather than duplicated.
    issuerUrl: ''
    # -- OIDC client id.
    clientId: ''
    # -- OIDC client secret. See `secrets.*` for the alternatives.
    clientSecret: ''
    # -- Sign-in button label: "Continue with <name>".
    providerName: SSO
    # -- Space- or comma-separated. The callback rejects a sign-in missing `email`, `sub` or
    # `name`, so do not narrow these without reason.
    scopes: openid profile email
    # -- Only needed when the document is not at `<issuerUrl>/.well-known/openid-configuration`.
    # better-auth fetches this verbatim, so it must be the full document URL.
    discoveryUrl: ''
    # -- Turn off only for an IdP that cannot do PKCE.
    pkce: true

  google:
    # -- Google OAuth client id. Both id and secret, or neither.
    clientId: ''
    # -- Google OAuth client secret.
    clientSecret: ''

  github:
    # -- GitHub OAuth client id. Both id and secret, or neither.
    clientId: ''
    # -- GitHub OAuth client secret.
    clientSecret: ''

# =============================================================================================
# Database
# =============================================================================================

postgres:
  # -- Deploy the bundled single-replica Postgres StatefulSet. Fine for a team instance; set
  # `false` and point `host` at a managed database (RDS, Cloud SQL, CloudNativePG) for anything
  # you care about - the bundled one has no HA, no backups and no connection pooler.
  enabled: true
  # -- Database host. Ignored when `postgres.enabled` is true (the chart's own Service is used);
  # required when it is false.
  host: ''
  # -- Database port.
  port: 5432
  # -- Database name. Created for you by the bundled Postgres; must already exist for an
  # external one.
  database: kinora
  # -- Database user.
  username: kinora
  # -- Database password. See `secrets.*` for the alternatives.
  # With the bundled Postgres this is read only by `initdb`, on first start - changing it later
  # rewrites the Secret but not the database. Rotate with `ALTER ROLE` first, then upgrade.
  password: ''
  # -- TLS mode for an external database, passed through as `PGSSLMODE`. One of `disable`,
  # `prefer`, `require`, `verify-ca`, `verify-full` or `no-verify`.
  # kinora has no sslmode setting of its own, but node-postgres (used by both the query layer
  # and the migrator) applies this env var because the connection config omits `ssl`.
  # It does NOT read `PGSSLROOTCERT`, so `require` verifies against Node's default CA bundle -
  # RDS and Cloud SQL, whose CAs are not in that bundle, generally need `no-verify`.
  sslMode: ''

  image:
    # -- Only used when `postgres.enabled` is true.
    repository: postgres
    # -- Postgres 18 or newer. Changing the major version means changing `dataDir` too.
    tag: '18.1'
    # -- Defaults to `image.pullPolicy`.
    pullPolicy: ''

  # -- PGDATA, used by the fast-shutdown preStop hook. Postgres 18 moved this to
  # `/var/lib/postgresql/<major>/docker`; the volume mounts one level up at
  # `/var/lib/postgresql`. Bump it together with `image.tag` when you move major versions -
  # it is a value precisely so that change is visible in review.
  dataDir: /var/lib/postgresql/18/docker

  persistence:
    # -- Turn off only for throwaway test installs; data is then lost on every pod restart.
    enabled: true
    # -- Empty uses the cluster default StorageClass.
    storageClass: ''
    accessModes:
      - ReadWriteOnce
    # -- A StatefulSet volumeClaimTemplate is IMMUTABLE after first install. Changing this (or
    # storageClass) later makes every subsequent `helm upgrade` fail; see the README.
    size: 20Gi
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # -- Extra arguments for the `postgres` process, e.g. `["-c", "max_connections=200"]`.
  extraArgs: []
  # -- Postgres reads SIGTERM as a *smart* shutdown that waits for clients, so the chart also
  # runs a `pg_ctl -m fast` preStop hook. This grace period covers that.
  terminationGracePeriodSeconds: 120
  # -- Deliberately empty: the official postgres image starts as root, chowns PGDATA, then
  # drops to uid 999 itself. Setting `fsGroup` fights that chown on large volumes and
  # `runAsNonRoot` breaks the entrypoint outright. This is the opposite of the server pod.
  podSecurityContext: {}
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''

# =============================================================================================
# Artifact storage - trace.zip, screenshots, videos. Run metadata always lives in Postgres.
# =============================================================================================

storage:
  local:
    # -- Store artifacts on a PersistentVolume. Ignored when `storage.s3` is fully configured.
    enabled: true
    # -- Mount path and `STORAGE_DIR`, kept as one value so they cannot drift. The server image
    # runs as uid 1001, which is what `server.podSecurityContext.fsGroup` arranges for.
    path: /app/.data/artifacts
    # -- Use a PVC you created yourself instead of letting the chart create one.
    existingClaim: ''
    # -- Empty uses the cluster default StorageClass.
    storageClass: ''
    # -- ReadWriteOnce pins the server to a single replica: /artifacts is served off local disk
    # by whichever replica the Service picks. Use ReadWriteMany, or S3, to scale out.
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    annotations: {}
    # -- Add `helm.sh/resource-policy: keep` so `helm uninstall` does not delete your traces.
    # The trade-off: a later re-install must either delete the PVC first or use
    # `helm install --take-ownership`.
    retainOnDelete: true

  s3:
    # -- Any S3-compatible store instead of a PersistentVolume: AWS S3, Cloudflare R2, MinIO,
    # Hetzner. This is also what unlocks more than one server replica.
    # ALL FIVE values are required - the server silently falls back to local disk if any one is
    # missing, so the chart refuses to render a partial configuration instead of letting you
    # find out later. Credentials may come from `secrets.*` instead of inline.
    # The bucket needs CORS allowing `GET` and the `Range` header from `publicUrl`: the trace
    # viewer's service worker range-fetches trace.zip straight from the browser.
    endpoint: ''
    region: ''
    bucket: ''
    accessKeyId: ''
    secretAccessKey: ''

# =============================================================================================
# Retention - THE DEFAULTS KEEP EVERYTHING FOREVER. Traces are what fill the disk.
# =============================================================================================

retention:
  # -- Delete stored trace.zip files older than N days but KEEP the runs, so pass rates, trends
  # and flaky history all survive - old runs just lose their "View trace" link. This is the
  # knob to reach for first. 0 = never.
  artifactDays: 0
  # -- Delete whole runs older than N days, history included. 0 = never.
  runDays: 0
  # -- Keep only the N newest runs per project, history included. 0 = unlimited.
  keepLastRuns: 0

# =============================================================================================
# E-mail - enables verification, password reset, invitations and alert e-mails.
# =============================================================================================

smtp:
  # -- host, port and from are required together; user/password stay optional for
  # unauthenticated relays. Leave `host` empty to disable every e-mail flow.
  host: ''
  port: 587
  user: ''
  password: ''
  # -- e.g. `kinora <no-reply@example.com>`
  from: ''

# =============================================================================================
# Integrations and observability
# =============================================================================================

slack:
  # -- The "Add to Slack" OAuth app. Without it, Slack alerts fall back to a manually pasted
  # incoming-webhook URL, which works perfectly well.
  clientId: ''
  clientSecret: ''

# -- Sentry DSN for server-side error reporting. Empty disables it.
sentryDsn: ''

# -- Ingest requests per minute per client IP - a DoS backstop, not a quota.
# Two caveats: the counter is in-memory and per-process, so the real ceiling is
# `server.replicaCount` x this number; and it keys on the leftmost `X-Forwarded-For` hop, so a
# load balancer that does not set XFF collapses every client into one bucket.
ingestRateLimit: 600

# -- Public read-only demo mode: auto-session as a seeded demo user, all mutations and ingest
# rejected. You almost certainly want `false`.
demo: false

# NOTE: `KINORA_CLOUD` is pinned to "false" and deliberately not exposed. Cloud mode requires
# four POLAR_* billing variables the chart does not ship, and the server will not boot without
# them. Self-host has every feature unlimited anyway.

# =============================================================================================
# Images
# =============================================================================================

image:
  # -- Tag for BOTH the server and web images. Empty uses the chart's `appVersion`, which is the
  # kinora release this chart version was tested against. Pin to a `sha-<commit>` to track main.
  tag: ''
  pullPolicy: IfNotPresent

# -- Applies to every pod in the release.
imagePullSecrets: []

# =============================================================================================
# Server workload
# =============================================================================================

server:
  image:
    # -- Change for a private mirror.
    repository: ghcr.io/amaingot/kinora-server
    # -- Defaults to `image.tag`, then the chart's `appVersion`.
    tag: ''

  # -- Must stay 1 while artifacts are on a ReadWriteOnce volume - /artifacts is served from
  # local disk by whichever replica the Service picks. Configure `storage.s3`, or a
  # ReadWriteMany volume, before raising this; the chart refuses to render otherwise.
  replicaCount: 1
  # -- Wired to both `PORT` and the Service `targetPort`, so the two cannot drift.
  containerPort: 3000

  migrations:
    # -- Run `node dist/scripts/migrate.mjs latest` as an initContainer before the server
    # starts. Turn off only if you apply migrations out of band.
    enabled: true
    # -- Bounded retry loop inside the container. This is deliberately not the pod's restart
    # backoff (0/10/30/70/150/310s), which can blow a `helm install --atomic --timeout` window
    # while Postgres is still coming up on a cold install.
    attempts: 30
    retryDelaySeconds: 10
    # -- Defaults to `server.resources`.
    resources: {}

  service:
    type: ClusterIP
    # -- Also the port the web pod's nginx proxies to.
    port: 3000
    annotations: {}
    nodePort: null

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

  autoscaling:
    # -- Requires `storage.s3`. See `server.replicaCount`.
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null

  pdb:
    # -- Pointless at one replica; useful once you are on S3 and scaled out.
    enabled: false
    minAvailable: 1
    maxUnavailable: null

  readinessProbe:
    # -- `GET /healthcheck`, which round-trips Postgres and answers 503 when it is unreachable.
    # Exactly right for readiness: a database outage takes the pod out of the Service.
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  livenessProbe:
    # -- A TCP check, NOT `/healthcheck`. That endpoint depends on the database, so an httpGet
    # liveness probe would turn a 30-second Postgres blip into a server restart loop for a
    # fault a restart cannot fix. Readiness already handles pulling the pod out of the Service.
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6

  startupProbe:
    enabled: false
    periodSeconds: 5
    failureThreshold: 30

  podSecurityContext:
    # -- The server image runs as uid 1001 and writes artifacts to the mounted volume; a freshly
    # provisioned PV arrives root-owned, and fsGroup is what makes it writable.
    # `OnRootMismatch` skips the recursive re-chown on every restart once the top-level
    # directory already matches - which matters a lot on a volume full of traces.
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    # -- Left false: `--enable-source-maps` and the S3 SDK both touch temporary paths.
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # -- The server closes its HTTP listener and drains the pg pool on SIGTERM, hard-exiting
  # after 10s.
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''

  # -- Raw `core/v1` EnvVar list, appended last so it overrides every other layer: it is the
  # final `env` entry, and an `env` entry beats every `envFrom` source. `valueFrom` reaches any
  # Secret or ConfigMap key, or the downward API. Use it for anything the chart does not model.
  extraEnv: []
  #  - name: NODE_OPTIONS
  #    value: --max-old-space-size=1536
  # -- Raw `core/v1` EnvFromSource list - whole ConfigMaps or Secrets. Rendered as the last
  # `envFrom` source, so it beats the chart's own Secret and `secrets.existingSecret` and
  # nothing else: it cannot override `secrets.mappings`, `server.extraEnv`, or any variable the
  # chart renders as a plain `env` entry. Use `server.extraEnv` to override those.
  extraEnvFrom: []
  # -- Extra containers in the server pod. The intended use is a database proxy on 127.0.0.1
  # (cloud-sql-proxy, pgbouncer, stunnel) for a managed database that needs more than
  # `postgres.sslMode` can express.
  sidecars: []
  # -- Extra init containers, run before the migration container.
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  # -- Override the container entrypoint. Empty uses the image default.
  command: []
  args: []

# =============================================================================================
# Web workload - nginx serving the dashboard SPA and trace viewer, and reverse-proxying the API
# =============================================================================================

web:
  image:
    repository: ghcr.io/amaingot/kinora-web
    # -- Defaults to `image.tag`, then the chart's `appVersion`.
    tag: ''

  # -- Stateless; scale freely. Two replicas keep the front door up during node rotation even
  # though the server is pinned to one on the default storage path.
  replicaCount: 2
  # -- Above 1024 so the container can run unprivileged. The chart templates nginx's `listen`
  # directive from this value.
  containerPort: 8080

  service:
    type: ClusterIP
    # -- The single public entrypoint. Ingress and HTTPRoute both target this.
    port: 80
    annotations: {}
    nodePort: null

  nginx:
    # -- Largest trace.zip an ingest request may carry.
    # Raising this above 100m accomplishes nothing: the server hardcodes a 100 MB body limit on
    # `/api/v1/*`, so a bigger upload is rejected one layer further in. The Ingress body-size
    # annotation is derived from this same value so the two cannot drift.
    clientMaxBodySize: 100m
    # -- Applied to `/artifacts/`. A large trace streaming to a slow client easily exceeds
    # nginx's 60s default between reads.
    proxyReadTimeout: 300s
    # -- Replace the generated Content-Security-Policy for the dashboard entirely. Empty
    # generates one, which already appends the S3 endpoint origin to `connect-src` when
    # `storage.s3` is configured.
    contentSecurityPolicy: ''
    # -- Extra origins appended to the generated `connect-src`.
    extraConnectSrc: []
    # -- Extra directives injected verbatim into the nginx `server {}` block - `real_ip`
    # configuration, `limit_req` zones, additional locations. Rendered through `tpl`.
    extraServerConfig: ''
    # -- Replace the whole generated config with a ConfigMap of your own, whose `default.conf`
    # key is mounted at /etc/nginx/conf.d/default.conf. You are then responsible for proxying
    # /api/, /trpc/, /artifacts/ and /healthcheck to the server Service, and for serving
    # /trace/ and the SPA fallback. Read `charts/kinora/files/nginx.conf.tpl` first.
    existingConfigMap: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null

  pdb:
    enabled: false
    minAvailable: 1
    maxUnavailable: null

  readinessProbe:
    # -- `GET /` - served from nginx's own disk. Never the proxied `/healthcheck`: that would
    # take the static frontend down during a database outage, so users would get a connection
    # error instead of the app's own error state.
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

  podSecurityContext:
    fsGroup: 101

  securityContext:
    # -- The chart runs nginx unprivileged: `containerPort` is above 1024, and emptyDir volumes
    # cover the paths the master process needs to write (`/var/cache/nginx`, `/tmp`), with the
    # pid file relocated. uid 101 is `nginx` in the upstream image.
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ''
  extraEnv: []
  extraEnvFrom: []
  sidecars: []
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================================
# Exposure - pick ingress OR httpRoute, or neither and bring your own.
#
# Everything goes to the web Service on one hostname. Do not split paths across backends: the
# dashboard's CSP is `connect-src 'self'` and the session cookie is host-only, so the API must
# be reachable on the same origin as the app. nginx inside the web pod does that split.
# =============================================================================================

ingress:
  enabled: false
  className: ''
  # -- `nginx.ingress.kubernetes.io/proxy-body-size` and `proxy-read-timeout` are added
  # automatically, derived from `web.nginx.*` so the two layers cannot disagree. Anything you
  # set here wins. Add your cert-manager issuer here.
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Hostname. Defaults to the host part of `publicUrl`.
  host: ''
  path: /
  pathType: Prefix
  # -- Additional `{host, path, pathType}` entries. `publicUrl` still governs the URLs the app
  # generates.
  extraHosts: []
  tls:
    enabled: false
    # -- Empty auto-names it `<fullname>-tls`, which is what cert-manager will fill.
    secretName: ''
    # -- Empty uses `ingress.host` plus every `extraHosts` entry.
    hosts: []

httpRoute:
  # -- Gateway API alternative to `ingress`. Requires the Gateway API CRDs.
  enabled: false
  annotations: {}
  # -- The Gateways to attach to. Required when enabled.
  parentRefs: []
  #  - name: public-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # -- Defaults to the host part of `publicUrl`.
  hostnames: []
  # -- Extra rules appended after the generated catch-all. Useful for splitting an auth policy
  # across browser paths and the token-authenticated `/api/v1` ingest path.
  extraRules: []

# =============================================================================================
# Chart furniture
# =============================================================================================

nameOverride: ''
fullnameOverride: ''
# -- Added to every object the chart creates.
commonLabels: {}
# -- Added to every object the chart creates.
commonAnnotations: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}
  # -- kinora never talks to the Kubernetes API. Leave this off.
  automountServiceAccountToken: false

tests:
  # -- Ship the `helm test` hook. Costs nothing unless you run `helm test`, and it is the only
  # check that catches an install which is green but has no working API proxy.
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.11.1
    pullPolicy: ''
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
