{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kinora.serviceAccountName" . }}
  labels: {{- include "kinora.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.serviceAccount.annotations) .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* kinora talks to no Kubernetes API, so the pods have no use for a projected token. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
