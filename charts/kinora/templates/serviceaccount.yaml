{{- /* Two accounts, deliberately. Only the server ever needs a cloud identity - it is the one
     that reads and writes the S3 artifact bucket - so it gets an account of its own to carry
     that annotation. A single shared account would hand the same S3 credentials to the
     internet-facing web tier and to the database container, neither of which touches S3. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kinora.serviceAccountName" . }}
  labels: {{- include "kinora.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.serviceAccount.annotations) .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* kinora talks to no Kubernetes API, so the pods have no use for the default kube-api-access
     token. This is unrelated to workload identity: the EKS pod identity webhook mounts its own
     projected token volume (audience sts.amazonaws.com) when annotations carry a role, so IRSA
     works with this left off - do not flip it while chasing a credentials error. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if include "kinora.server.serviceAccount.create" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kinora.server.serviceAccountName" . }}
  labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- /* server.serviceAccount.annotations wins over the chart-wide ones, which in turn win over
       commonAnnotations - the narrower scope is the more deliberate. */}}
  {{- with (merge (deepCopy .Values.server.serviceAccount.annotations) (deepCopy .Values.serviceAccount.annotations) .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
