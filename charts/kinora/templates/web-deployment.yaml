apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kinora.web.fullname" . }}
  labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "kinora.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* The nginx config is mounted from a ConfigMap, so without this a change to it
             would update the ConfigMap and leave every pod serving the old config until
             something else happened to restart them. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kinora.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kinora.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.web.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "kinora.web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* No command/args override. Relocating the pid file with `-g "pid ...;"` looks
               tempting but nginx rejects it: the image's own nginx.conf already has a `pid`
               directive, and a second one from -g is a fatal "pid directive is duplicate".
               An emptyDir over /var/run makes the default path writable instead. */}}
          {{- /* No build args and no env: the published web image is built without
               VITE_KINORA_SERVER_URL, so packages/web/src/lib/env.ts falls back to
               globalThis.location.origin at page load. One image serves any hostname. */}}
          {{- with .Values.web.extraEnv }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          {{- if .Values.web.readinessProbe.enabled }}
          readinessProbe:
            {{- /* `/` is served from nginx's own disk. Never probe the proxied /healthcheck: a
                 database outage would then take the static frontend down too, and users would
                 get a connection error instead of the app's own error state. */}}
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.web.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.livenessProbe.failureThreshold }}
          {{- end }}
          lifecycle:
            preStop:
              {{- /* Let in-flight requests and the endpoint removal race resolve before nginx
                   stops accepting. */}}
              exec:
                command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit"]
          {{- with .Values.web.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- /* nginx creates its temp/scratch directories at startup and writes
                 /var/run/nginx.pid, neither of which works on a read-only root filesystem. */}}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.web.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.web.nginx.existingConfigMap | default (printf "%s-nginx" (include "kinora.fullname" .)) }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
