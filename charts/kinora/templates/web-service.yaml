apiVersion: v1
kind: Service
metadata:
  {{- /* The single public entrypoint: Ingress and HTTPRoute both target this, and in-cluster CI
       runners can post here directly to keep large trace uploads off the load balancer. */}}
  name: {{ include "kinora.web.fullname" . }}
  labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with (merge (deepCopy .Values.web.service.annotations) .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      {{- with .Values.web.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector: {{- include "kinora.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
