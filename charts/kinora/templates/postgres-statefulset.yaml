{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kinora.postgres.fullname" . }}
  labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "kinora.postgres.fullname" . }}
  {{- /* Single replica, deliberately. There is no replication here, so a second pod is just a
       second empty database. Run a managed database or an operator if you need HA. */}}
  replicas: 1
  selector:
    matchLabels: {{- include "kinora.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.postgres.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kinora.componentLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
        {{- with .Values.postgres.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kinora.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Empty by default, and that is the point: the official postgres image starts as
           root, chowns PGDATA, then drops to uid 999 itself. An fsGroup fights that chown on a
           large volume and runAsNonRoot breaks the entrypoint outright. The exact opposite of
           the server pod, which must have fsGroup: 1001. */}}
      {{- with .Values.postgres.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds }}
      containers:
        - name: postgres
          image: {{ include "kinora.postgres.image" . }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy | default .Values.image.pullPolicy }}
          {{- with .Values.postgres.extraArgs }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {{- include "kinora.postgres.passwordRef" . | nindent 18 }}
            {{- /* PGDATA is deliberately not set: the image already defaults it to
                 /var/lib/postgresql/<major>/docker, and setting it here would only invite the
                 two to drift. postgres.dataDir exists solely for the preStop hook. */}}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            {{- /* /var/lib/postgresql - NOT /var/lib/postgresql/data. Postgres 18 moved PGDATA
                 to /var/lib/postgresql/<major>/docker, so the volume mounts one level up. A
                 chart copied from a Postgres 15 example initialises a database in a directory
                 nothing ever reads. */}}
            - name: data
              mountPath: /var/lib/postgresql
          lifecycle:
            preStop:
              {{- /* Postgres reads SIGTERM as a SMART shutdown, which waits for clients to
                   disconnect - so without this, every node rotation ends in SIGKILL at the
                   grace period and the next start does crash recovery. gosu because the hook
                   runs as root and pg_ctl refuses to. (gosu ships in the Debian-based official
                   image; an -alpine variant would need su-exec instead.) */}}
              exec:
                command:
                  - gosu
                  - postgres
                  - pg_ctl
                  - -D
                  - {{ .Values.postgres.dataDir | quote }}
                  - -m
                  - fast
                  - -w
                  - stop
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            {{- /* Deliberately slack: crash recovery on a large volume can outlast a normal
                 probe budget, and killing Postgres mid-recovery restarts recovery from
                 scratch. */}}
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.postgres.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    {{- /* IMMUTABLE after first install: changing size or storageClassName here makes every
         subsequent `helm upgrade` fail with "updates to statefulset spec ... are forbidden".
         Expand the PVC in place (if the StorageClass allows it) and change this value in the
         same upgrade, or recreate the StatefulSet with --cascade=orphan.
         These PVCs are owned by the StatefulSet controller, so `helm uninstall` leaves them
         behind - delete them explicitly if you really want the data gone. */}}
    - metadata:
        name: data
        labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "postgres") | nindent 10 }}
        {{- with .Values.postgres.persistence.annotations }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
