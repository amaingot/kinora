{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kinora.postgres.fullname" . }}
  labels: {{- include "kinora.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Headless: there is exactly one replica, so pod-IP DNS is what we want - no kube-proxy
       hop and no stale conntrack entry after the pod restarts. */}}
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector: {{- include "kinora.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
{{- end }}
