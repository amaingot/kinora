{{- $inline := include "kinora.inlineSecretData" . | fromYaml }}
{{- if $inline }}
{{- /*
Credentials supplied inline in values. Keys are the literal environment variable names so the
whole Secret can be mounted with envFrom - which is also what lets secrets.existingSecret
override any subset of it without the chart knowing which keys it contains.

Not annotated `resource-policy: keep`: every value here is fully derived from values.yaml, so
there is nothing to preserve across an uninstall, and leaving a live AUTH_SECRET behind would
be worse than regenerating one from the same values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kinora.secretName" . }}
  labels: {{- include "kinora.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $k, $v := $inline }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- end }}
