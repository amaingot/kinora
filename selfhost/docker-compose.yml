# kinora self-host: Postgres + server (local-FS artifacts) + web (single-origin reverse proxy).
# Run from this directory:
#   cp .env.example .env     # then edit PUBLIC_URL, AUTH_SECRET, POSTGRES_PASSWORD
#   docker compose pull && docker compose up -d
#   open $PUBLIC_URL
#
# Everything is one origin: the web container serves the dashboard and proxies the API to the
# server, so there's no CORS or cross-subdomain cookie setup. Artifacts live on a local volume
# (no S3 needed). See README.md.
#
# Images come prebuilt from GHCR (published by .github/workflows/docker.yml on every main commit;
# pin one with KINORA_IMAGE_TAG=sha-<commit>). To build from source instead, layer the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: kinora-selfhost

services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kinora-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. The server waits for it to finish.
  migrate:
    image: ghcr.io/amaingot/kinora-server:${KINORA_IMAGE_TAG:-latest}
    command: [node, dist/scripts/migrate.mjs, latest]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      BASE_URL: ${PUBLIC_URL}
      WEB_ORIGIN: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: ghcr.io/amaingot/kinora-server:${KINORA_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      BASE_URL: ${PUBLIC_URL}
      WEB_ORIGIN: ${PUBLIC_URL}
    volumes:
      - kinora-artifacts:/app/.data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/amaingot/kinora-web:${KINORA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Override the cloud (static-only) nginx with the self-host proxy config. The dashboard
    # calls the API on its own origin, so the same image works for any PUBLIC_URL.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - server

volumes:
  kinora-db:
  kinora-artifacts:
